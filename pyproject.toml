[project]
name = "fidls"
version = "0.2.0"
description = "FiDLS: qubit mapping via subgraph isomorphism + filtered depth-limited search (Li et al., TC 2021)"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "license.md"}
authors = [
    {name = "Sanjiang Li", email = "mrlisj@gmail.com"},
]
dependencies = [
    "networkx>=2.8",
    "numpy>=1.20",
    "qiskit>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Flat layout — the modules live at the top level (router.py, ag.py, etc.).
# Package restructure into fidls/ is a future change.
py-modules = [
    "router",
    "ag",
    "inimap",
    "utils",
    "vfs",
    "maps",
    "qiskit_pass",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
